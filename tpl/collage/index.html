<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>collage（杂志拼贴）模板 · 预览</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,500&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    /* ===== 基础（所有模板通用） ===== */
    .pg-root {
      width: 400px;
      box-sizing: border-box;
      color: #111;
      border-radius: 6px;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    .pg-root, .pg-root *, .pg-root *::before, .pg-root *::after { box-sizing: border-box; }

    /* ===== collage（杂志拼贴）：全屏背景 + 大标题覆盖 ===== */
    .pg-collage {
      background: #121212; border-radius: 18px; overflow: hidden;
      display: flex; flex-direction: column; justify-content: flex-end;
      height: 100%; position: relative; box-shadow: 0 14px 22px -6px rgba(0,0,0,0.4);
    }
    .pg-collage .cl-bg {
      position: absolute; inset: 0; z-index: 0;
      background: linear-gradient(135deg, #3a3a3a, #101010); background-size: cover; background-position: center;
    }
    .pg-collage .cl-overlay {
      position: absolute; inset: 0; z-index: 1;
      background: linear-gradient(to top, rgba(0,0,0,0.78) 0%, rgba(0,0,0,0.1) 100%);
    }
    .pg-collage .cl-content {
      position: relative; z-index: 2; padding: 180px 32px 32px;
      display: flex; flex-direction: column;
    }
    .pg-collage .cl-tag {
      font-family: 'Space Mono', monospace; font-size: 12px; font-weight: 700;
      letter-spacing: 2px; text-transform: uppercase; color: #d9b382;
      background: rgba(255,255,240,0.05); border: 1px solid rgba(217,179,130,0.3);
      padding: 4px 14px; border-radius: 0;
      align-self: flex-start; margin-bottom: 14px; flex-shrink: 0;
    }
    .pg-collage .cl-title {
      font-family: 'Playfair Display', serif; font-weight: 700; font-size: 38px;
      line-height: 1.1; color: #f2ede6; text-shadow: 0 2px 6px rgba(0,0,0,0.3);
      margin: 0 0 8px; flex-shrink: 0;
      overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
    }
    .pg-collage .cl-desc {
      font-size: 16px; color: #d6cec2; max-width: 86%; margin-bottom: 24px;
      opacity: 0.9; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden;
    }
    .pg-collage .cl-foot {
      border-top: 1px solid rgba(255,255,255,0.12); padding-top: 16px;
      display: flex; justify-content: space-between; align-items: center; flex-shrink: 0;
    }
    .pg-collage .cl-author { display: flex; align-items: center; gap: 8px; }
    .pg-collage .cl-avatar {
      width: 36px; height: 36px; border-radius: 50%;
      border: 2px solid #d9b382; background-size: cover; background-position: center; flex-shrink: 0;
    }
    .pg-collage .cl-name { font-size: 14px; color: #ece6dc; }
    .pg-collage .cl-date { font-size: 12px; color: #aa9f91; }
    .pg-collage .cl-qr {
      flex: 0 0 56px; width: 56px; height: 56px; margin-left: auto;
      background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.06);
      border-radius: 6px; padding: 4px; overflow: hidden;
    }
    .pg-collage .cl-qr canvas, .pg-collage .cl-qr img { display: block; width: 100% !important; height: 100% !important; }
  </style>
</head>
<body>
  <!-- 直接打开本文件即可预览；生成时由 PosterGenerator 替换占位符 -->
  <div class="pg-root pg-collage">
    <div class="cl-bg" data-pg-cover></div>
    <div class="cl-overlay"></div>
    <div class="cl-content">
      <span class="cl-tag" data-pg-if="siteName" data-pg-text="siteName">封面故事</span>
      <h3 class="cl-title" data-pg-text="title">声波与建筑</h3>
      <p class="cl-desc" data-pg-if="summary" data-pg-text="summary | truncate:120">空间如何塑造声音，声音又如何定义空间。</p>
      <div class="cl-foot">
        <div class="cl-author" data-pg-if="author">
          <img class="cl-avatar" data-pg-img="authorAvatar" alt="作者"
               src="data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='45' fill='%237a6a58'/%3E%3Ccircle cx='50' cy='38' r='20' fill='%23d6cec2'/%3E%3Cellipse cx='50' cy='70' rx='30' ry='20' fill='%23d6cec2'/%3E%3C/svg%3E" />
          <div>
            <div class="cl-name" data-pg-text="author">Zoe 张</div>
            <div class="cl-date" data-pg-if="date" data-pg-text="date">2026.07.13</div>
          </div>
        </div>
        <div class="cl-qr" data-pg-qr data-pg-qr-size="220" data-pg-qr-color="#121212" data-pg-qr-bg="#d9b382"><span style="color:#bbb;font-size:6px;">二维码</span></div>
      </div>
    </div>
  </div>

  <!-- 注册本模板的扩展函数（生成时由库执行；独立打开时不依赖库） -->
  <script>
    (function () {
      var name = 'collage';
      window.PosterCardTpl = window.PosterCardTpl || {};
      window.PosterCardTpl[name] = {
        label: '杂志拼贴',
        helpers: {},
      };
    })();
  </script>
</body>
</html>
