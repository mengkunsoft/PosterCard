<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>dwqr（普通版）模板 · 预览</title>
  <style>
    /* ===== 基础（所有模板通用） ===== */
    .pg-root {
      width: 400px;                 /* 固定宽度；与其它模板一致，内部用绝对 px、不随宽度缩放 */
      height: 666px;                /* 固定高度（原 720:1200 设计在 400 下的高度，取整） */
      box-sizing: border-box;
      color: #111;
      border-radius: 6px;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    .pg-root, .pg-root *, .pg-root *::before, .pg-root *::after { box-sizing: border-box; }

    /* ===== dwqr（普通版）版式：纯白底 + 顶部满宽封面 + 内容 ===== */
    .pg-dwqr {
      background: #fff;
      display: flex;
      flex-direction: column;
      height: 100%;
    }
    .pg-dwqr .dwqr-cover {
      width: 100%; aspect-ratio: 3 / 2; overflow: hidden; background: #eef1f3;
      flex-shrink: 0;
    }
    .pg-dwqr .dwqr-cover-img { width: 100%; height: 100%; background-image: linear-gradient(135deg,#c9d6e8,#8fa6c4); background-size: cover; background-position: center; background-repeat: no-repeat; }
    .pg-dwqr .dwqr-body {
      padding: 22px;
      flex: 1 1 auto;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }
    .pg-dwqr .dwqr-title {
      color: #1c1f1e; font-size: 22px; font-weight: 700; line-height: 1.34;
      overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
      flex-shrink: 0;
    }
    .pg-dwqr .dwqr-summary {
      margin-top: 10px; color: #545c64; font-size: 14px; line-height: 1.7;
      overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden;
      flex-shrink: 0;
    }
    .pg-dwqr .dwqr-divider { margin: 16px 0 14px; height: 1px; background: #ededed; flex-shrink: 0; }
    .pg-dwqr .dwqr-foot {
      display: flex; align-items: center; justify-content: space-between;
      margin-top: auto;
      flex-shrink: 0;
    }
    .pg-dwqr .dwqr-logo { max-height: 34px; max-width: 234px; object-fit: contain; }
    .pg-dwqr .dwqr-qr {
      flex: 0 0 72px; width: 72px; height: 72px; margin-left: 12px; padding: 4px;
      background: #fff; border: 1px solid #eee; border-radius: 4px; overflow: hidden;
    }
    .pg-dwqr .dwqr-qr canvas, .pg-dwqr .dwqr-qr img { display: block; width: 100% !important; height: 100% !important; }
  </style>
</head>
<body>
  <!-- 直接打开本文件即可预览；生成时由 PosterGenerator 替换占位符 -->
  <div class="pg-root pg-dwqr">
    <div class="dwqr-cover">
      <div class="dwqr-cover-img" data-pg-cover></div>
    </div>
    <div class="dwqr-body">
      <div class="dwqr-title" data-pg-text="title">如何用纯前端生成一个好看的分享海报</div>
      <div class="dwqr-summary" data-pg-if="summary" data-pg-text="summary | truncate:120">只需传入关键字段与样式参数，库会自动排版封面、二维码与品牌信息，并导出高清 PNG 图片。</div>
      <div class="dwqr-divider"></div>
      <div class="dwqr-foot">
        <img class="dwqr-logo" data-pg-if="logo" data-pg-img="logo" alt="logo"
             src="data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='180' height='44'%3E%3Crect width='180' height='44' rx='6' fill='%23286d8b'/%3E%3Ctext x='90' y='28' font-size='18' fill='%23fff' text-anchor='middle' font-family='sans-serif'%3ELOGO%3C/text%3E%3C/svg%3E" />
        <div class="dwqr-qr" data-pg-qr data-pg-qr-size="300"><span style="color:#bbb;font-size:6px;">二维码</span></div>
      </div>
    </div>
  </div>

  <!-- 注册本模板的扩展函数（生成时由库执行；独立打开时不依赖库） -->
  <script>
    (function () {
      var name = 'dwqr';
      window.PosterCardTpl = window.PosterCardTpl || {};
      window.PosterCardTpl[name] = {
        label: '闪电博-卡片',
        helpers: {}
        // 固定 width:400px、内部绝对 px，不随宽度等比缩放（与其它模板一致）
      };
    })();
  </script>
</body>
</html>
